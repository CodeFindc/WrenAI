name: wrenai-claude-init

services:
  wren-claude-init:
    container_name: wren-claude-init-service
    build:
      context: ../../../
      dockerfile: sdk/wren-langchain/examples/Dockerfile.cn.claude
    image: wren-claude-init:cn
    stdin_open: true
    tty: true
    environment:
      # ANTHROPIC API / OneAPI / vLLM API Base & Key forwarding
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-http://192.168.110.209:8200/v1}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-sk-dummy}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-Qwen3.6-27B-AEON-Ultimate-Uncensored-BF16}

      # OpenAI API config Embedded Model (or general OpenAI-compatible endpoints)
      - WREN_EMBEDDING_PROVIDER=openai
      - WREN_EMBEDDING_MODEL=${WREN_EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      - EM_OPENAI_API_KEY=${EM_OPENAI_API_KEY:-sk-HDoRjhs3Z4WIeU1cYfho9jaNQWvye5lPWyY1YpEmmJpdrBjx}
      - EM_OPENAI_BASE_URL=${EM_OPENAI_BASE_URL:-http://192.168.110.208:8100/v1}

      # Environment variables for automatic connection profile setup
      - ACTIVE_PROFILE=${ACTIVE_PROFILE:-default}
      - DATASOURCE=${DATASOURCE:-}
      - DB_HOST=${DB_HOST:-}
      - DB_PORT=${DB_PORT:-}
      - DB_NAME=${DB_NAME:-}
      - DB_USER=${DB_USER:-}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - SSL_MODE=${SSL_MODE:-}
    volumes:
      # Mount project directory to retain generated models and wren_project.yml
      - .:/project
